<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ödeme Başarılı - DampingVar.com</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-950 text-white">
  <div class="min-h-screen flex items-center justify-center">
    <div class="text-center">
      <div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-check text-white text-3xl"></i>
      </div>
      <h1 class="text-3xl font-bold mb-2">Ödeme Başarılı!</h1>
      <p class="text-gray-400 mb-4">Siparişiniz alındı. Satıcı ürünü hazırlamaya başlayacaktır.</p>
      <div class="space-y-2">
        <a href="/dashboard.html?tab=orders" class="inline-block bg-blue-600 px-6 py-2 rounded-lg">Siparişlerim</a>
        <a href="/" class="inline-block bg-gray-700 px-6 py-2 rounded-lg ml-3">Ana Sayfa</a>
      </div>
    </div>
  </div>
  <script type="module">
    import { supabase } from './assets/js/supabaseClient.js';
    
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order_id');
    
    if (orderId) {
      await supabase
        .from('orders')
        .update({ 
          order_status: 'PAYMENT_CONFIRMED',
          payment_status: 'CONFIRMED',
          escrow_status: 'HELD'
        })
        .eq('id', orderId);
    }
  </script>
</body>
</html>

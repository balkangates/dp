<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Şifre Sıfırlama</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-950 text-white flex items-center justify-center min-h-screen">
  <div class="bg-gray-900 p-8 rounded-xl w-96">
    <h2 class="text-xl font-bold mb-4">Şifre Sıfırlama</h2>
    <input type="email" id="resetEmail" placeholder="E-posta adresiniz" class="w-full p-2 rounded bg-gray-800 border border-gray-700 mb-4">
    <button id="sendReset" class="w-full bg-blue-600 py-2 rounded">Şifre Sıfırlama Bağlantısı Gönder</button>
    <div id="resetMsg" class="mt-3 text-sm"></div>
  </div>
  <script type="module">
    import { supabase } from './assets/js/supabaseClient.js';
    document.getElementById('sendReset').onclick = async () => {
      const email = document.getElementById('resetEmail').value;
      const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/reset-password.html' });
      document.getElementById('resetMsg').innerText = error ? 'Hata: '+error.message : 'Bağlantı e-postanıza gönderildi.';
    };
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    if(hashParams.get('type') === 'recovery') {
      document.body.innerHTML = `<div class="bg-gray-900 p-8 rounded-xl w-96"><h2>Yeni Şifre Belirle</h2><input type="password" id="newPwd" placeholder="Yeni şifre" class="w-full p-2 rounded bg-gray-800"><button id="updatePwd" class="mt-3 w-full bg-green-600 py-2 rounded">Güncelle</button></div>`;
      document.getElementById('updatePwd').onclick = async () => {
        const newPassword = document.getElementById('newPwd').value;
        const { error } = await supabase.auth.updateUser({ password: newPassword });
        alert(error ? error.message : 'Şifre güncellendi, giriş yapabilirsiniz.');
        if(!error) window.location.href = '/login.html';
      };
    }
  </script>
</body>
</html>
